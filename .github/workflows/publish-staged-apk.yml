name: Publish verified staged APK
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Matching draft release ID
        required: true
      name:
        description: Complete APK filename
        required: true
      sha256:
        description: Expected complete APK SHA-256
        required: true
      parts:
        description: Number of numbered staged parts (1-32)
        required: true
permissions:
  contents: write
concurrency:
  group: publish-apk-${{ inputs.release_id }}
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check publication safeguards
        run: python3 -m unittest -v test_assemble_release.py
      - name: Assemble, verify, upload and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          APK_NAME: ${{ inputs.name }}
          APK_SHA256: ${{ inputs.sha256 }}
          APK_PARTS: ${{ inputs.parts }}
        run: python3 assemble_release.py
